[package]
name = "ish-maydoni"
version = "0.1.0"
edition = "2021"

[lib]
name = "ish_maydoni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
