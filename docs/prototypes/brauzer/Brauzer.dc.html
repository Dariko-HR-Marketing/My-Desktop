<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ichki brauzer — tarmoqlar va messenjerlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F4F6}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15171C; background: #F3F4F6; min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Asosiy menyu" style="flex: 1 1 232px; background: #111827; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">

      <div>
        <div style="color: #FFFFFF; font-weight: 600; font-size: 16px">Ish maydoni</div>
        <div style="color: #9AA3B2; font-size: 12px">[Tashkilot nomi]</div>
      </div>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="color: #8B94A5; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding: 14px 12px 6px">{{g.name}}</div>
      <sc-for list="{{g.items}}" as="item" hint-placeholder-count="4">
        <sc-if value="{{item.isLink}}" hint-placeholder-val="{{true}}">
          <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
            <span style="{{item.iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></span>
            <span style="flex: 1; min-width: 0"><span style="display: block">{{item.label}}</span><sc-if value="{{item.hasSub}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 11px; color: #9AA3B2; font-weight: 400">{{item.sub}}</span></sc-if></span>
            <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
          </a>
        </sc-if>
        <sc-if value="{{item.isBtn}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="{{item.btnStyle}}">
            <span style="{{item.iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></span>
            <span style="flex: 1; text-align: left">{{item.label}}</span>
            <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
          </button>
        </sc-if>
      </sc-for>
    </sc-for>
    <div style="margin-top: auto; padding-top: 14px; border-top: 1px solid #263042; display: flex; align-items: center; gap: 10px; padding-left: 8px">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #DCE5FB; color: #1E3A8A; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 13px">AK</div>
      <div><div style="color: #FFFFFF; font-size: 13px; font-weight: 600">[F.I.Sh.]</div><div style="color: #9AA3B2; font-size: 12px">Bosh mutaxassis</div></div>
    </div>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF">
    <div role="tablist" aria-label="Brauzer tablari" style="display: flex; align-items: flex-end; gap: 2px; padding: 8px 12px 0; background: #E9EBEF; flex-wrap: wrap">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}}">
          <span style="{{tb.dot}}"></span>
          <span style="flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tb.name}}</span>
          <sc-if value="{{tb.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #C4282E; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{tb.badge}}</span></sc-if>

        </button>
      </sc-for>
      <a href="Brauzer_Start.dc.html" aria-label="Yangi tab" style="width: 34px; height: 34px; color: #3B4049; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E5EA; flex-wrap: wrap">

      <button type="button" aria-label="Oldinga" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #A0A5AE; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
      <button type="button" aria-label="Yangilash" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #3B4049; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"></path></svg></button>
      <div style="flex: 1 1 300px; height: 36px; border-radius: 18px; background: #F1F2F5; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; color: #3B4049">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E6B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Xavfsiz ulanish"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.url}}</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F6672" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sevimlilarga qoʻshish"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
      </div>
      <button type="button" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #3B4049; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM12 12h7v5h-7z"></path></svg>Rasm ichida rasm</button>
      <button type="button" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #3B4049; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3zM12 4v16"></path></svg>Yonma-yon</button>
      <button type="button" aria-label="Yuklab olinganlar" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #3B4049; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></button>
    </div>

    <div style="flex: 1; min-height: 740px; position: relative; overflow: hidden">
      <sc-if value="{{isYt}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px">
          <div style="flex: 3 1 480px; min-width: 0">
            <div style="width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #15171C; display: flex; align-items: center; justify-content: center; position: relative">
              <span style="width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
              <span style="position: absolute; left: 16px; right: 16px; bottom: 14px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 36%; height: 4px; border-radius: 2px; background: #FFFFFF"></span></span>
            </div>
            <div style="margin-top: 14px; font-size: 18px; font-weight: 600">[Video nomi]</div>
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #E3E6EA"></span><span style="display: flex; flex-direction: column; gap: 6px"><span style="height: 10px; width: 140px; border-radius: 4px; background: #DADDE2"></span><span style="height: 8px; width: 90px; border-radius: 4px; background: #E6E8EC"></span></span></div>
          </div>
          <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{rows6}}" as="s" hint-placeholder-count="6">
              <div style="display: flex; gap: 10px"><span style="width: 140px; height: 80px; flex: none; border-radius: 8px; background: #E6E8EC"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 7px; padding-top: 4px"><span style="height: 10px; border-radius: 4px; background: #DADDE2; width: 92%"></span><span style="height: 9px; border-radius: 4px; background: #E6E8EC; width: 60%"></span></span></div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isChat}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; height: 740px">
          <div style="width: 320px; flex: none; border-right: 1px solid #EEF0F3; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
            <div style="height: 36px; border-radius: 18px; background: #F1F2F5; margin-bottom: 8px"></div>
            <sc-for list="{{chats}}" as="c" hint-placeholder-count="9">
              <div style="{{c.row}}"><span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #DDE2EA"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span style="height: 10px; border-radius: 4px; background: #D3D7DE; width: 55%"></span><span style="height: 9px; border-radius: 4px; background: #E3E6EA; width: 85%"></span></span><sc-if value="{{c.unread}}" hint-placeholder-val="{{false}}"><span style="{{c.badge}}">{{c.n}}</span></sc-if></div>
            </sc-for>
          </div>
          <div style="{{chatBg}}">
            <span style="align-self: flex-start; width: 44%; height: 48px; border-radius: 14px; background: #FFFFFF"></span>
            <span style="{{bubbleMe1}}"></span>
            <span style="align-self: flex-start; width: 52%; height: 70px; border-radius: 14px; background: #FFFFFF"></span>
            <span style="{{bubbleMe2}}"></span>
            <div style="height: 44px; border-radius: 22px; background: #FFFFFF; margin-top: 12px"></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isIg}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; justify-content: center; gap: 40px; padding: 20px 24px">
          <div style="width: 100%; max-width: 470px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; gap: 14px">
              <sc-for list="{{stories}}" as="s" hint-placeholder-count="6"><span style="width: 56px; height: 56px; border-radius: 50%; background: #F1F2F5; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #B83280"></span></sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 50%; background: #E3E6EA"></span><span style="height: 10px; width: 120px; border-radius: 4px; background: #DADDE2"></span></div>
            <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; background: #E6E8EC"></div>
            <div style="display: flex; gap: 14px"><span style="width: 22px; height: 22px; border-radius: 6px; background: #E3E6EA"></span><span style="width: 22px; height: 22px; border-radius: 6px; background: #E3E6EA"></span><span style="width: 22px; height: 22px; border-radius: 6px; background: #E3E6EA"></span></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isG}}" hint-placeholder-val="{{false}}">
        <div style="padding: 24px 32px; max-width: 760px">
          <div style="height: 44px; border-radius: 22px; box-shadow: 0 0 0 1px #D5D9E0; display: flex; align-items: center; padding: 0 18px; font-size: 15px; gap: 10px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6672" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>xizmat safari hisoboti namunasi
          </div>
          <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 26px">
            <sc-for list="{{results}}" as="r" hint-placeholder-count="5">
              <div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 8px; border-radius: 4px; background: #E3E6EA; width: 24%"></span><span style="height: 13px; border-radius: 4px; background: #C9D6F7; width: {{r.w}}"></span><span style="height: 9px; border-radius: 4px; background: #E6E8EC; width: 92%"></span><span style="height: 9px; border-radius: 4px; background: #E6E8EC; width: 68%"></span></div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 14px; background: rgba(21,23,28,0.78); color: #FFFFFF; font-size: 12px; white-space: nowrap">{{cur.caption}}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: "yt" };
  }
  renderVals() {
    const st = this.state;
    const P = {
      home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      todo: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
      cal: "M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z",
      browser: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z",
      edo: "M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6",
      hr: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",
      boss: "M4 20V10M10 20V4M16 20v-7M22 20H2",
      tg: "M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z",
      wa: "M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12zM8 12h.01M12 12h.01M16 12h.01",
      ig: "M4 7h3l2-3h6l2 3h3v13H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
      fb: "M7 10v11M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 18.4 21H7V10l4-8a3 3 0 0 1 4 3.9z",
      yt: "M3 5h18v14H3zM10 9l5 3-5 3z",
      plus: "M12 5v14M5 12h14"
    };
    const tint = { tg: "#2B6CB0", wa: "#1F8A52", ig: "#B83280", fb: "#3B5BDB", yt: "#C4282E", g: "#1D4ED8" };
    const base = "display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 10px;border-radius:8px;text-decoration:none;font-size:14px;box-sizing:border-box;";
    const pill = "min-width:22px;height:22px;padding:0 7px;border-radius:11px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;box-sizing:border-box;";
    const tabKeys = ["yt", "tg", "ig", "wa", "g"];
    const mk = (key, label, href, opts) => {
      const o = opts || {};
      const isTab = tabKeys.indexOf(key) >= 0;
      const on = isTab ? st.tab === key : key === "browser";
      return {
        label, href, d: P[key], badge: o.badge || "", hasBadge: !!o.badge, sub: o.sub || "", hasSub: !!o.sub,
        isLink: !isTab, isBtn: isTab, pressed: on ? "true" : "false",
        current: on ? "page" : "false",
        style: base + (on ? "color:#FFFFFF;background:#22304D;font-weight:600;" : "color:#C9CED8;font-weight:500;"),
        btnStyle: base + "width:100%;border:0;font:inherit;font-size:14px;cursor:pointer;" + (on ? "color:#FFFFFF;background:#22304D;font-weight:600;" : "color:#C9CED8;background:transparent;font-weight:500;"),
        iconBox: tint[key] ? "width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF;background:" + tint[key] + ";" : "width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;",
        badgeStyle: pill + (o.red ? "background:#C4282E;color:#FFFFFF;" : "background:#2A3550;color:#E4E7EE;"),
        pick: () => this.setState({ tab: key })
      };
    };
    const groups = [
      { name: "ASOSIY", items: [mk("home", "Bosh sahifa", "Main.dc.html"), mk("todo", "Vazifalarim", "Vazifalar.dc.html", { badge: "5" }), mk("cal", "Kalendar", "#"), mk("browser", "Brauzer", "Brauzer_Start.dc.html")] },
      { name: "MODULLAR", items: [mk("edo", "Hujjat aylanishi", "EDO_Modul.dc.html", { badge: "4", sub: "Hujjatlar · Ijro · Topshiriqlar" }), mk("hr", "Kadrlar xizmatlari", "Xizmatlar.dc.html"), mk("boss", "Rahbar paneli", "Rahbar.dc.html")] },
      { name: "TARMOQLAR VA MESSENJERLAR", items: [mk("tg", "Telegram", "#", { badge: "12", red: true }), mk("wa", "WhatsApp", "#", { badge: "3", red: true }), mk("ig", "Instagram", "#"), mk("yt", "YouTube", "#"), mk("fb", "Facebook", "Brauzer_Start.dc.html"), mk("plus", "Qoʻshish", "Brauzer_Start.dc.html")] }
    ];
    const info = {
      yt: { name: "YouTube", url: "youtube.com/watch?v=…", caption: "youtube.com — video shu oynada ochiladi; «Rasm ichida rasm» bilan boshqa ishga oʻtsa ham davom etadi" },
      tg: { name: "Telegram", url: "web.telegram.org", badge: "12", caption: "web.telegram.org — rasmiy veb-versiya shu oynada" },
      ig: { name: "Instagram", url: "instagram.com", caption: "instagram.com — rasmiy veb-versiya shu oynada" },
      wa: { name: "WhatsApp", url: "web.whatsapp.com", badge: "3", caption: "web.whatsapp.com — telefon QR-kod orqali bir marta ulanadi" },
      g: { name: "Google", url: "google.com/search?q=xizmat+safari+hisoboti+namunasi", caption: "Google qidiruvi — natijalar shu oynada ochiladi" }
    };
    const tabBase = "height:36px;width:180px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-radius:10px 10px 0 0;font:inherit;font-size:13px;cursor:pointer;color:#15171C;box-sizing:border-box;";
    const tabs = tabKeys.map((k) => ({
      name: info[k].name, badge: info[k].badge || "", hasBadge: !!info[k].badge && st.tab !== k,
      sel: st.tab === k ? "true" : "false",
      style: tabBase + (st.tab === k ? "background:#FFFFFF;font-weight:600;" : "background:transparent;"),
      dot: "width:10px;height:10px;border-radius:3px;flex:none;background:" + tint[k] + ";",
      pick: () => this.setState({ tab: k })
    }));
    const isWa = st.tab === "wa";
    const accent = isWa ? "#1F8A52" : "#2B6CB0";
    const chats = [0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => ({
      row: "display:flex;align-items:center;gap:12px;height:62px;padding:0 8px;border-radius:10px;" + (i === 0 ? (isWa ? "background:#E7F4EC;" : "background:#E8EEFC;") : ""),
      unread: i === 1 || i === 3, n: i === 1 ? "5" : "2",

    }));
    const meBg = isWa ? "#D3EEDC" : "#DCE6FB";
