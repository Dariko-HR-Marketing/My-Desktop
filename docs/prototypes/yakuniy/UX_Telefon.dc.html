<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Telefon — Bosh sahifa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{c.root}}">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #DCE5FB; color: #1E3A8A; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">AK</span>
      <div style="flex: 1; min-width: 0">
        <div style="{{c.sub12}}">Chorshanba, 28-okt</div>
        <div style="{{c.h18}}">Xayrli tong, [Ism]</div>
      </div>
      <span role="img" aria-label="Bildirishnomalar, 6 ta yangi" style="{{c.iconBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="{{c.dot}}"></span></span>
    </div>
    <div style="{{c.search}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>Qidiring yoki Google</div>
    <div style="{{c.hero}}">
      <div style="font-size: 14px; font-weight: 500">{{summary}}</div>
      <div style="{{c.heroBar}}"><span style="{{progress}}"></span></div>
      <div style="display: flex; gap: 16px; font-size: 12px; opacity: 0.85"><span>Kechikkan: 2</span><span>Imzo kutmoqda: 4</span><span>11:30 uchrashuv</span></div>
    </div>
    <div style="display: flex; justify-content: space-between">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="5">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; position: relative">
          <span style="{{a.box}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>
          <sc-if value="{{a.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{c.badge}}">{{a.badge}}</span></sc-if>
          <span style="{{c.sub11}}">{{a.n}}</span>
        </span>
      </sc-for>
    </div>
    <div style="{{c.card}}">
      <div style="{{c.cardTitle}}">Diqqat talab qiladi</div>
      <sc-for list="{{alerts}}" as="al" hint-placeholder-count="2">
        <div style="{{c.row}}"><span style="flex: 1; font-size: 14px; font-weight: 500">{{al.t}}</span><span style="{{al.chip}}">{{al.w}}</span></div>
      </sc-for>
    </div>
    <div style="{{c.card}}">
      <div style="{{c.cardTitle}}">Bugungi vazifalar</div>
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
        <label style="{{c.row}}">
          <input type="checkbox" checked="{{t.done}}" onChange="{{t.toggle}}" style="{{c.check}}">
          <span style="{{t.titleStyle}}">{{t.title}}</span>
          <span style="{{c.time}}">{{t.time}}</span>
        </label>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Pastki menyu" style="{{c.tabbar}}">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <span style="{{tb.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg><span style="font-size: 11px">{{tb.n}}</span></span>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { t1: false } };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const T = dark ? {
      bg: "#14161B", surface: "#1E2128", text: "#E8EAEE", sub: "#A9AFBA", line: "#2A2E37", accent: "#7FA2FF", heroBg: "#23304F", heroText: "#E8EAEE", red: "#FF8A80", redSoft: "#3A2124", amber: "#F5B860", amberSoft: "#3A2E1A", nav: "#1A1D23", chip: "#2A2E37", track: "rgba(255,255,255,0.18)"
    } : {
      bg: "#F3F4F6", surface: "#FFFFFF", text: "#15171C", sub: "#4A505C", line: "#EEF0F3", accent: "#1D4ED8", heroBg: "#1D4ED8", heroText: "#FFFFFF", red: "#B42318", redSoft: "#FDECEA", amber: "#8A4B00", amberSoft: "#FFF1DB", nav: "#FFFFFF", chip: "#EEF0F3", track: "rgba(255,255,255,0.3)"
    };
    const c = {
      root: "width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;font-family:'IBM Plex Sans',system-ui,sans-serif;background:" + T.bg + ";color:" + T.text + ";",
      sub12: "font-size:12px;color:" + T.sub + ";",
      sub11: "font-size:11px;color:" + T.sub + ";",
      h18: "font-size:18px;font-weight:600;",
      iconBtn: "position:relative;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:" + T.surface + ";color:" + T.text + ";",
      dot: "position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:" + T.red + ";",
      search: "height:44px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;background:" + T.surface + ";color:" + T.sub + ";",
      hero: "border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:" + T.heroBg + ";color:" + T.heroText + ";",
      heroBar: "height:6px;border-radius:3px;overflow:hidden;background:" + T.track + ";",
      badge: "position:absolute;top:-4px;right:6px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:#C4282E;border:2px solid " + T.bg + ";",
      card: "border-radius:16px;padding:14px 14px 4px;background:" + T.surface + ";",
      cardTitle: "font-size:15px;font-weight:600;margin-bottom:4px;",
      row: "display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid " + T.line + ";cursor:pointer;",
      check: "width:20px;height:20px;margin:0;flex:none;accent-color:" + T.accent + ";",
      time: "font-family:'IBM Plex Mono',monospace;font-size:12px;color:" + T.sub + ";",
      tabbar: "flex:none;height:76px;display:flex;align-items:flex-start;padding-top:8px;box-sizing:border-box;background:" + T.nav + ";border-top:1px solid " + T.line + ";"
    };
    const P = {
      tg: "M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z",
      wa: "M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12zM8 12h.01M12 12h.01M16 12h.01",
      ig: "M4 7h3l2-3h6l2 3h3v13H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
      yt: "M3 5h18v14H3zM10 9l5 3-5 3z",
      mail: "M3 6h18v12H3zM3 7l9 6 9-6"
    };
    const A = (n, k, col, badge) => ({ n, d: P[k], badge: badge || "", hasBadge: !!badge, box: "width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:" + col + ";" });
    const apps = [A("Telegram", "tg", "#2B6CB0", "12"), A("WhatsApp", "wa", "#1F8A52", "3"), A("Instagram", "ig", "#B83280"), A("YouTube", "yt", "#C4282E"), A("Pochta", "mail", "#475467", "3")];
    const chip = (fg, bg) => "display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap;color:" + fg + ";background:" + bg + ";";
    const alerts = [
      { t: "14-son topshiriq", w: "−2 kun", chip: chip(T.red, T.redSoft) },
      { t: "Murojaat № M-2041", w: "Bugun 18:00", chip: chip(T.amber, T.amberSoft) }
    ];
    const base = [{ id: "t1", title: "Tender hujjatlari", time: "12:00" }, { id: "t2", title: "Oʻquv rejasi", time: "15:00" }, { id: "t3", title: "Shartnoma loyihasi", time: "16:30" }];
    const st = this.state;
    const tasks = base.map((t) => {
      const d = !!st.done[t.id];
      return { title: t.title, time: t.time, done: d,
        titleStyle: "flex:1;font-size:14px;" + (d ? "text-decoration:line-through;color:" + T.sub + ";" : ""),
        toggle: () => this.setState({ done: Object.assign({}, this.state.done, { [t.id]: !this.state.done[t.id] }) }) };
    });
    const left = tasks.filter((t) => !t.done).length + 1;
    const TB = (n, d, on) => ({ n, d, style: "flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;" + (on ? "color:" + T.accent + ";font-weight:600;" : "color:" + T.sub + ";") });
    const tabs = [
      TB("Bosh", "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z", true),
      TB("Vazifalar", "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"),
      TB("Brauzer", "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"),
      TB("Modullar", "M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"),
      TB("Profil", "M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z")
    ];
    return {
      c, apps, alerts, tasks, tabs,
      summary: "Bugun " + left + " ta ish qoldi",
      progress: "display:block;height:6px;border-radius:3px;background:" + T.heroText + ";width:" + Math.round((5 - left) / 5 * 100) + "%;"
    };
  }
}
</script>
</body>
</html>
