<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Planshet — Bosh sahifa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 834px; height: 1112px; overflow: hidden; display: flex; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15171C; background: #F3F4F6">
  <nav aria-label="Asosiy menyu" style="width: 72px; flex: none; background: #111827; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="width: 36px; height: 36px; border-radius: 9px; background: #2F5BEA; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px">IM</div>
    <sc-for list="{{nav}}" as="it" hint-placeholder-count="9">
      <sc-if value="{{it.div}}" hint-placeholder-val="{{false}}"><span style="width: 32px; height: 1px; background: #263042; margin: 4px 0"></span></sc-if>
      <a href="#" aria-label="{{it.label}}" style="{{it.style}}">
        <span style="{{it.iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg></span>
        <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{it.badgeStyle}}">{{it.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="flex: 1; min-width: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D9E0; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #5F6672; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>Qidiring yoki Google
      </div>
      <span style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E3E5EA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #C4282E"></span></span>
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #DCE5FB; color: #1E3A8A; font-weight: 600; display: flex; align-items: center; justify-content: center">AK</span>
    </div>
    <div>
      <div style="font-size: 13px; color: #5F6672">Chorshanba, 28-oktabr · 09:02</div>
      <div style="font-size: 26px; font-weight: 600; margin-top: 2px">Xayrli tong, [Ism]</div>
      <div style="font-size: 14px; color: #4A505C; margin-top: 4px">4 ta vazifa qoldi · 2 tasi kechikkan · 11:30 da uchrashuv</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 14px; padding: 16px"><div style="font-size: 13px; color: #4A505C">{{k.l}}</div><div style="{{k.vs}}">{{k.v}}</div><div style="font-size: 12px; color: #4A505C">{{k.s}}</div></div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 14px; padding: 16px 16px 4px">
      <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px">Diqqat talab qiladi</div>
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid #EEF0F3"><span style="flex: 1; font-size: 14px; font-weight: 500">{{a.t}}</span><span style="{{a.chip}}">{{a.w}}</span></div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 14px; padding: 16px 16px 4px">
      <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px">Bugungi vazifalar</div>
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-top: 1px solid #EEF0F3"><span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid #8A909A; box-sizing: border-box; flex: none"></span><span style="flex: 1; font-size: 14px">{{t.t}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4A505C">{{t.m}}</span></div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 14px; padding: 16px">
      <div style="font-size: 16px; font-weight: 600; margin-bottom: 12px">Xabarlar</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; border-radius: 12px; background: #F6F7F9"><span style="{{m.box}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{m.n}}</span><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #C4282E; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{m.c}}</span></div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      todo: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
      cal: "M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z",
      browser: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z",
      edo: "M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6",
      tg: "M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z",
      wa: "M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12zM8 12h.01M12 12h.01M16 12h.01",
      yt: "M3 5h18v14H3zM10 9l5 3-5 3z",
      mail: "M3 6h18v12H3zM3 7l9 6 9-6"
    };
    const tint = { tg: "#2B6CB0", wa: "#1F8A52", yt: "#C4282E" };
    const N = (k, label, o) => { o = o || {}; return { label, d: P[k], div: !!o.div, badge: o.badge || "", hasBadge: !!o.badge,
      style: "position:relative;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;" + (k === "home" ? "background:#22304D;color:#FFFFFF;" : "color:#C9CED8;"),
      iconBox: "width:26px;height:26px;display:flex;align-items:center;justify-content:center;" + (tint[k] ? "border-radius:7px;color:#FFFFFF;background:" + tint[k] + ";" : ""),
      badgeStyle: "position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #111827;color:#FFFFFF;background:" + (o.red ? "#C4282E" : "#2A3550") + ";" }; };
    const nav = [N("home", "Bosh sahifa"), N("todo", "Vazifalarim", { badge: "5" }), N("cal", "Kalendar"), N("browser", "Brauzer"), N("edo", "Hujjat aylanishi", { badge: "4", div: true }), N("tg", "Telegram", { badge: "12", red: true, div: true }), N("wa", "WhatsApp", { badge: "3", red: true }), N("yt", "YouTube")];
    const vs = "font-size:28px;font-weight:600;line-height:1.1;margin:8px 0 4px;";
    const kpis = [
      { l: "Bugungi vazifalar", v: "1 / 5", vs, s: "4 tasi qoldi" },
      { l: "Muddati oʻtgan", v: "2", vs: vs + "color:#B42318;", s: "1 topshiriq · 1 toʻlov" },
      { l: "Imzo kutmoqda", v: "4", vs: vs + "color:#1D4ED8;", s: "Hujjat aylanishi" },
      { l: "Oylik ish rejasi", v: "68%", vs, s: "25 banddan 17 tasi" }
    ];
    const chip = "display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap;";
    const alerts = [
      { t: "14-son topshiriq boʻyicha maʼlumot", w: "2 kun kechikdi", chip: chip + "background:#FDECEA;color:#B42318;" },
      { t: "Hisob-faktura № 118 toʻlovi", w: "1 kun kechikdi", chip: chip + "background:#FDECEA;color:#B42318;" },
      { t: "Murojaat № M-2041 ga javob", w: "Bugun 18:00", chip: chip + "background:#FFF1DB;color:#8A4B00;" }
    ];
    const tasks = [{ t: "Tender hujjatlarini koʻrib chiqish", m: "12:00" }, { t: "Yangi xodimlar uchun oʻquv rejasi", m: "15:00" }, { t: "Shartnoma loyihasini kelishish", m: "16:30" }, { t: "Hamkorga javob xatini yuborish", m: "17:30" }];
    const box = (c) => "width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:" + c + ";";
    const msgs = [{ n: "Telegram", c: "12", d: P.tg, box: box(tint.tg) }, { n: "WhatsApp", c: "3", d: P.wa, box: box(tint.wa) }, { n: "Pochta", c: "3", d: P.mail, box: box("#475467") }];
    return { nav, kpis, alerts, tasks, msgs };
  }
}
</script>
</body>
</html>
