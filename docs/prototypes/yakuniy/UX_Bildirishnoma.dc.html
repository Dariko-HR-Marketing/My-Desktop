<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Bildirishnomalar markazi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15171C; background: #F3F4F6">
  <div aria-hidden="true" style="width: 248px; flex: none; background: #111827; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 36px; height: 36px; border-radius: 9px; background: #2F5BEA"></div>
    <sc-for list="{{ghost}}" as="g" hint-placeholder-count="10"><span style="height: 12px; border-radius: 4px; background: #263042; width: {{g.w}}"></span></sc-for>
  </div>
  <div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column">
    <div style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E3E5EA"></div>
    <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 16px">
      <span style="height: 28px; width: 320px; border-radius: 6px; background: #DADDE2"></span>
      <div style="display: flex; gap: 14px"><sc-for list="{{tiles}}" as="t" hint-placeholder-count="5"><span style="flex: 1; height: 110px; border-radius: 12px; background: #FFFFFF"></span></sc-for></div>
      <div style="display: flex; gap: 20px"><span style="flex: 2; height: 520px; border-radius: 12px; background: #FFFFFF"></span><span style="flex: 1; height: 520px; border-radius: 12px; background: #FFFFFF"></span></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(17,24,39,0.32)"></div>

  <aside role="dialog" aria-label="Bildirishnomalar" style="position: absolute; top: 0; right: 0; bottom: 0; width: 440px; background: #FFFFFF; box-shadow: -12px 0 40px rgba(17,24,39,0.18); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; padding: 18px 20px 10px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">Bildirishnomalar</h1>
      <span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #FDECEA; color: #B42318; font-size: 12px; font-weight: 600; display: flex; align-items: center">6 yangi</span>
      <span style="margin-left: auto; font-size: 13px; font-weight: 600; color: #1D4ED8">Hammasini oʻqildi</span>
      <span role="img" aria-label="Sozlash" style="width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #3B4049"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4"></path></svg></span>
      <span role="img" aria-label="Yopish" style="width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #3B4049"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></span>
    </div>
    <div role="tablist" aria-label="Turkumlar" style="display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid #E3E5EA">
      <span role="tab" aria-selected="true" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; box-shadow: inset 0 -2px 0 #1D4ED8">Hammasi <span style="font-size: 12px; color: #1D4ED8">6</span></span>
      <span role="tab" aria-selected="false" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4A505C">Ish <span style="font-size: 12px">3</span></span>
      <span role="tab" aria-selected="false" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4A505C">Xabarlar <span style="font-size: 12px">2</span></span>
      <span role="tab" aria-selected="false" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4A505C">Tizim <span style="font-size: 12px">1</span></span>
    </div>
    <div style="flex: 1; overflow: hidden; padding: 4px 20px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #5F6672; padding: 14px 0 4px">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0F3">
            <span style="{{n.box}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
            <div style="flex: 1; min-width: 0">
              <div style="display: flex; gap: 8px; align-items: baseline"><span style="{{n.titleStyle}}">{{n.t}}</span><span style="margin-left: auto; font-size: 12px; color: #5F6672; white-space: nowrap">{{n.time}}</span></div>
              <div style="font-size: 13px; color: #4A505C; margin-top: 3px; line-height: 1.45">{{n.s}}</div>
              <sc-if value="{{n.hasAct}}" hint-placeholder-val="{{false}}"><span style="margin-top: 8px; display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; background: #EEF2FD; color: #1D4ED8">{{n.act}}</span></sc-if>
            </div>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1D4ED8; margin-top: 6px; flex: none"></span></sc-if>
          </div>
        </sc-for>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid #E3E5EA; font-size: 13px">
      <span style="width: 40px; height: 24px; border-radius: 12px; background: #C3C8D1; position: relative; flex: none"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>
      <span style="flex: 1"><b>Jim rejim</b> · faqat shoshilinch xabarlar</span>
      <span style="color: #5F6672">18:00–09:00</span>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const box = (bg, c) => "width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:" + bg + ";color:" + c + ";";
    const N = (t, s, time, d, b, act, unread) => ({ t, s, time, d, box: b, act: act || "", hasAct: !!act, unread: !!unread, titleStyle: "font-size:14px;" + (unread ? "font-weight:600;" : "font-weight:500;") });
    const P = {
      sign: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",
      warn: "M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
      tg: "M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z",
      wa: "M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12zM8 12h.01M12 12h.01M16 12h.01",
      cal: "M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z",
      sys: "M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5",
      todo: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
    };
    const groups = [
      { name: "HOZIR", items: [
        N("Imzo kutmoqda: shartnoma loyihasi", "Hujjat aylanishi · Huquq boʻlimi · muddat bugun 18:00", "2 daq", P.sign, box("#EEF2FD", "#1D4ED8"), "Imzolash", true),
        N("Uchrashuvga 15 daqiqa qoldi", "11:30 · Hamkor bilan videoqoʻngʻiroq", "5 daq", P.cal, box("#EEF2FD", "#1D4ED8"), "Qoʻshilish", true),
        N("Telegram · 3 ta suhbatda 12 xabar", "Ish guruhi, [Hamkasb], [Hamkor] — bitta qatorga yigʻildi", "8 daq", P.tg, box("#2B6CB0", "#FFFFFF"), "Ochish", true)
      ] },
      { name: "BUGUN ERTAROQ", items: [
        N("Muddati oʻtdi: 14-son topshiriq", "Ijro nazorati · rahbarga xabar yuborildi", "08:00", P.warn, box("#FDECEA", "#B42318"), "Ochish", true),
        N("Yangi topshiriq berildi", "Direktor oʻrinbosari: tender xulosasi, 12:00 gacha", "08:45", P.todo, box("#F1F2F4", "#3B4049"), null, true),
        N("WhatsApp · [Hamkor]", "«Uchrashuv 11:30 da, havola yuborildi»", "08:31", P.wa, box("#1F8A52", "#FFFFFF"), null, false),
        N("Dastur yangilandi — 1.4", "Yangi: tab guruhlari va tungi rejim", "07:58", P.sys, box("#F1F2F4", "#3B4049"), null, false)
      ] }
    ];
    return { groups, ghost: ["70%", "60%", "80%", "55%", "75%", "65%", "50%", "70%", "60%", "40%"].map((w) => ({ w })), tiles: [1, 2, 3, 4, 5].map(() => ({})) };
  }
}
</script>
</body>
</html>
