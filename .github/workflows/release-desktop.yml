name: Release desktop

# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux and publish a GitHub Release.
# The release also carries latest.json, which installed apps poll to update themselves.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           content of the updater private key (npx tauri signer generate -w updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none)
#   TAURI_UPDATER_PUBKEY                content of the matching updater.key.pub
# Windows code signing (optional, removes SmartScreen warnings) is added later with a certificate.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci
      - run: npm run build -w @ish-maydoni/shared

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Inject the real updater key and ask for updater artifacts (the repo keeps a placeholder key).
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBKEY }}"}}}'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Ish maydoni ${{ github.ref_name }}'
          releaseBody: 'Oʻrnatish: Windows — .msi/.exe, macOS — .dmg, Linux — .deb/.AppImage.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
