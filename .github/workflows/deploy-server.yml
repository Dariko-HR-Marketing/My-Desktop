name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without the deploy secrets this workflow is a no-op instead of a red build on every push.
      - name: Check deploy secrets
        id: gate
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER_: ${{ secrets.SSH_USER }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$USER_" ] && [ -n "$DOMAIN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set SSH_HOST, SSH_USER, SSH_PRIVATE_KEY and DOMAIN in Settings → Secrets → Actions."
          fi

      - name: Install SSH key
        if: steps.gate.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload to server
        if: steps.gate.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --filter 'protect deploy/.env' \
            --include 'apps/' --include 'apps/server/***' \
            --include 'apps/desktop/' --include 'apps/desktop/package.json' \
            --include 'packages/' --include 'packages/shared/***' \
            --include 'deploy/' --include 'deploy/***' \
            --include 'package.json' --include 'package-lock.json' --include 'tsconfig.base.json' --include '.dockerignore' \
            --exclude '*' \
            --exclude 'node_modules' --exclude 'dist' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/my-desktop/"

      - name: Build and restart
        if: steps.gate.outputs.ready == 'true'
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/my-desktop/deploy && docker compose --env-file .env up -d --build && docker image prune -f"

      - name: Health check
        if: steps.gate.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ secrets.DOMAIN }}/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
