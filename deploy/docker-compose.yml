name: my-desktop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    command: ['postgres', '-c', 'shared_buffers=96MB', '-c', 'max_connections=40']
    environment:
      POSTGRES_DB: ishmaydoni
      POSTGRES_USER: ishmaydoni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ishmaydoni -d ishmaydoni']
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8080'
      NODE_OPTIONS: --max-old-space-size=256
      DATA_STORE: postgres
      DATABASE_URL: postgresql://ishmaydoni:${POSTGRES_PASSWORD}@postgres:5432/ishmaydoni
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
